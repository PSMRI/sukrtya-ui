version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
    # ports:
    #   - "3000:80" # Commented out for Coolify to avoid port conflicts. Coolify handles routing.
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3 